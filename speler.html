<!DOCTYPE html><html lang="nl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Deelnemers — GJ Creator SMP</title>

<link rel="stylesheet" href="style.css">

</head><body><header class="navbar"><a href="index.html" class="logo">
    GJ <span>CREATOR SMP</span>
</a>

<nav>
    <a href="index.html">Home</a>
    <a href="spelers.html" class="active">Deelnemers</a>
    <a href="index.html#tijdlijn">Tijdlijn</a>
    <a href="index.html#nieuws">Nieuws</a>
</nav>

<a href="#" class="discord-button">
    Discord
</a>

</header><main><section class="page-hero">

    <span class="small-title">
        SEIZOEN 1
    </span>

    <h1>
        Deelnemers
    </h1>

    <p>
        Bekijk alle deelnemers van GJ Creator SMP.
    </p>

</section>


<section class="content-section">

    <div class="players-toolbar">

        <div>
            <span class="small-title">
                SPELERS
            </span>

            <h2 id="playerAmount">
                0 deelnemers
            </h2>
        </div>


        <div class="player-filter">

            <button
                class="filter-button active"
                onclick="filterPlayers('alle', this)"
            >
                Alle
            </button>

            <button
                class="filter-button"
                onclick="filterPlayers('levend', this)"
            >
                Levend
            </button>

            <button
                class="filter-button"
                onclick="filterPlayers('dood', this)"
            >
                Dood
            </button>

        </div>

    </div>


    <div
        class="players-grid players-page-grid"
        id="playersGrid"
    ></div>

</section>

</main><footer><div class="footer-logo">
    GJ <span>CREATOR SMP</span>
</div>

<p>
    Seizoen 1 • Minecraft SMP
</p>

</footer><script src="spelers.js"></script><script>

const playersGrid = document.getElementById("playersGrid");
const playerAmount = document.getElementById("playerAmount");


function renderPlayers(filter = "alle") {

    playersGrid.innerHTML = "";


    const filteredPlayers = spelers.filter(speler => {

        if (filter === "alle") {
            return true;
        }

        return speler.status === filter;

    });


    playerAmount.textContent =
        `${filteredPlayers.length} deelnemer${filteredPlayers.length === 1 ? "" : "s"}`;


    filteredPlayers.forEach(speler => {

        const card = document.createElement("a");

        card.className = "player-card";

        card.href = `speler.html?id=${speler.id}`;


        card.innerHTML = `

            <div class="player-image-container">

                <img
                    src="${speler.skin}"
                    alt="${speler.naam}"
                    class="player-skin-image"
                >

                <div class="player-status ${speler.status}">
                    ${
                        speler.status === "levend"
                        ? "● LEVEND"
                        : "☠ DOOD"
                    }
                </div>

            </div>


            <div class="player-card-content">

                <span class="player-role">
                    ${speler.rol}
                </span>

                <h3>
                    ${speler.naam}
                </h3>


                <div class="player-mini-stats">

                    <span>
                        ⚔ ${speler.kills}
                    </span>

                    <span>
                        ☠ ${speler.deaths}
                    </span>

                </div>

            </div>

        `;


        playersGrid.appendChild(card);

    });

}


function filterPlayers(filter, button) {

    document
        .querySelectorAll(".filter-button")
        .forEach(btn => btn.classList.remove("active"));


    button.classList.add("active");


    renderPlayers(filter);

}


renderPlayers();

</script></body>
</html>
