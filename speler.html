<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speler | GJ Creator SMP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="index.html" class="brand">
            <span>GJ CREATOR SMP</span>
        </a>

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Menu openen"
            aria-expanded="false">
            ☰
        </button>

        <nav class="navigation" id="navigation">
            <a href="index.html">Home</a>
            <a href="spelers.html">Deelnemers</a>
            <a href="deaths.html">Deaths</a>
            <a href="statistieken.html">Statistieken</a>
            <a href="tierlist.html">Tierlist</a>
            <a href="bingo.html">Bingo</a>
        </nav>

    </div>
</header>


<main>

    <section class="player-profile">

        <!-- TERUG -->
        <a href="spelers.html" class="back-button">
            ← Terug naar deelnemers
        </a>


        <!-- PROFIEL -->
        <div
            class="profile-card"
            id="profileCard">

            <div class="profile-loading">
                Speler laden...
            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="footer-inner">

        <div>
            <div class="footer-brand">
                GJ CREATOR SMP
            </div>

            <p>
                Seizoen 1 • Survival • Community
            </p>
        </div>

        <p>
            © 2026 GJ Creator SMP
        </p>

    </div>

</footer>


<script src="spelers.js"></script>


<script>

    /* =================================
       MOBIEL MENU
    ================================= */

    const menuButton =
        document.getElementById("menuButton");

    const navigation =
        document.getElementById("navigation");


    menuButton.addEventListener("click", () => {

        const isOpen =
            navigation.classList.toggle("open");

        menuButton.setAttribute(
            "aria-expanded",
            isOpen
        );

        menuButton.textContent =
            isOpen ? "✕" : "☰";

    });


    /* =================================
       URL ID OPHALEN
    ================================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const spelerId =
        params.get("id");


    const profileCard =
        document.getElementById("profileCard");


    /* =================================
       STATUS
    ================================= */

    function getStatusText(status) {

        if (status === "levend") {
            return "LEVEND";
        }

        if (status === "dood") {
            return "DOOD";
        }

        return "ONBEKEND";
    }


    function getStatusClass(status) {

        if (status === "levend") {
            return "profile-alive";
        }

        if (status === "dood") {
            return "profile-dead";
        }

        return "profile-unknown";
    }


    /* =================================
       DEATH INFO
    ================================= */

    function maakDeathInfo(speler) {

        if (
            speler.status !== "dood" &&
            !speler.deaths
        ) {

            return "";

        }


        if (
            speler.deathReason ||
            speler.deathDate
        ) {

            return `

                <div class="death-info">

                    <div class="death-title">
                        💀 Death informatie
                    </div>

                    ${
                        speler.deathReason
                        ? `
                            <p>
                                <strong>Reden:</strong>
                                ${speler.deathReason}
                            </p>
                        `
                        : ""
                    }

                    ${
                        speler.deathDate
                        ? `
                            <p>
                                <strong>Datum:</strong>
                                ${speler.deathDate}
                            </p>
                        `
                        : ""
                    }

                </div>

            `;

        }


        return "";

    }


    /* =================================
       EVENTS
    ================================= */

    function maakEvents(speler) {

        if (
            !speler.events ||
            speler.events <= 0
        ) {

            return `

                <div class="events-empty">

                    <span>📅</span>

                    <p>
                        Nog geen events geregistreerd.
                    </p>

                </div>

            `;

        }


        return `

            <div class="events-empty">

                <span>📅</span>

                <p>
                    ${speler.events}
                    event${speler.events === 1 ? "" : "s"}
                    geregistreerd.
                </p>

            </div>

        `;

    }


    /* =================================
       PROFIEL LADEN
    ================================= */

    function laadSpeler() {

        if (
            typeof spelers === "undefined" ||
            !Array.isArray(spelers)
        ) {

            profileCard.innerHTML = `

                <div class="profile-error">

                    <h1>Fout</h1>

                    <p>
                        spelers.js kon niet worden geladen.
                    </p>

                </div>

            `;

            return;

        }


        const speler =
            spelers.find(
                item => item.id === spelerId
            );


        if (!speler) {

            profileCard.innerHTML = `

                <div class="profile-error">

                    <div class="error-icon">
                        ?
                    </div>

                    <h1>
                        Speler niet gevonden
                    </h1>

                    <p>
                        Deze speler bestaat niet in
                        GJ Creator SMP Seizoen 1.
                    </p>

                    <a
                        href="spelers.html"
                        class="button button-primary">
                        Bekijk deelnemers
                    </a>

                </div>

            `;

            return;

        }


        document.title =
            speler.naam +
            " | GJ Creator SMP";


        const statusText =
            getStatusText(speler.status);


        const statusClass =
            getStatusClass(speler.status);


        profileCard.innerHTML = `

            <div class="profile-top">

                <div class="profile-skin-area">

                    <div class="skin-glow"></div>

                    <img
                        class="profile-skin"
                        src="${speler.skin}"
                        alt="Minecraft skin van ${speler.naam}"
                        onerror="
                            this.style.display='none';
                            document.querySelector('.skin-fallback').style.display='flex';
                        "
                    >

                    <div
                        class="skin-fallback"
                        style="display:none;">
                        ?
                    </div>

                </div>


                <div class="profile-main">

                    <div
                        class="profile-status ${statusClass}">
                        ${statusText}
                    </div>


                    <h1>
                        ${speler.naam}
                    </h1>


                    <div class="profile-role">
                        ${speler.rol || "Deelnemer"}
                    </div>


                    <p class="profile-description">
                        ${
                            speler.beschrijving ||
                            "Geen beschrijving beschikbaar."
                        }
                    </p>

                </div>

            </div>


            <!-- STATISTIEKEN -->

            <div class="profile-stats">

                <div class="profile-stat">

                    <span class="stat-icon">
                        ⚔️
                    </span>

                    <strong>
                        ${speler.kills || 0}
                    </strong>

                    <small>
                        Kills
                    </small>

                </div>


                <div class="profile-stat">

                    <span class="stat-icon">
                        💀
                    </span>

                    <strong>
                        ${speler.deaths || 0}
                    </strong>

                    <small>
                        Deaths
                    </small>

                </div>


                <div class="profile-stat">

                    <span class="stat-icon">
                        📅
                    </span>

                    <strong>
                        ${speler.events || 0}
                    </strong>

                    <small>
                        Events
                    </small>

                </div>

            </div>


            <!-- EXTRA INFO -->

            <div class="profile-sections">

                <div class="profile-section">

                    <h2>
                        Over ${speler.naam}
                    </h2>

                    <p>
                        ${
                            speler.beschrijving ||
                            "Deze speler heeft nog geen beschrijving."
                        }
                    </p>

                </div>


                ${maakDeathInfo(speler)}


                <div class="profile-section">

                    <h2>
                        Events
                    </h2>

                    ${maakEvents(speler)}

                </div>

            </div>

        `;

    }


    /* =================================
       START
    ================================= */

    laadSpeler();

</script>


<style>

/* =================================
   PROFIEL PAGINA
================================= */

.player-profile {

    width:
        min(1050px, calc(100% - 32px));

    margin: auto;

    padding:
        70px 0 100px;
}


/* =================================
   TERUG BUTTON
================================= */

.back-button {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 25px;

    color: #8fa0b9;

    font-size: 13px;

    font-weight: 800;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.back-button:hover {

    color: white;

    transform:
        translateX(-3px);
}


/* =================================
   PROFIEL CARD
================================= */

.profile-card {

    overflow: hidden;

    border:
        1px solid var(--border);

    border-radius:
        24px;

    background:
        linear-gradient(
            135deg,
            rgba(255, 48, 63, 0.05),
            rgba(36, 124, 255, 0.06)
        ),
        var(--card);

    box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.35);
}


/* =================================
   BOVENKANT
================================= */

.profile-top {

    min-height: 410px;

    padding:
        50px;

    display: grid;

    grid-template-columns:
        390px 1fr;

    align-items: center;

    gap: 50px;

    position: relative;
}


/* =================================
   SKIN
================================= */

.profile-skin-area {

    position: relative;

    min-height: 330px;

    display: flex;

    align-items: center;
    justify-content: center;
}

.skin-glow {

    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 48, 63, 0.18),
            rgba(36, 124, 255, 0.10),
            transparent 70%
        );

    filter:
        blur(15px);
}

.profile-skin {

    position: relative;

    z-index: 2;

    width: 310px;
    height: 310px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 20px 25px
            rgba(0, 0, 0, 0.45)
        );
}

.skin-fallback {

    position: relative;

    z-index: 3;

    width: 150px;
    height: 150px;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--red),
            var(--blue)
        );

    color: white;

    font-size: 60px;
    font-weight: 900;
}


/* =================================
   INFO
================================= */

.profile-main {

    position: relative;

    z-index: 3;
}

.profile-status {

    display: inline-flex;

    padding:
        7px 12px;

    margin-bottom: 15px;

    border-radius: 999px;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1px;
}

.profile-alive {

    color: #6dffad;

    background:
        rgba(54, 220, 123, 0.12);

    border:
        1px solid
        rgba(54, 220, 123, 0.22);
}

.profile-dead {

    color: #ff6671;

    background:
        rgba(255, 48, 63, 0.12);

    border:
        1px solid
        rgba(255, 48, 63, 0.22);
}

.profile-unknown {

    color: #aeb8cb;

    background:
        rgba(255, 255, 255, 0.06);
}


.profile-main h1 {

    margin: 0;

    color: white;

    font-size:
        clamp(50px, 7vw, 82px);

    line-height: 0.95;

    letter-spacing: -3px;
}


.profile-role {

    margin-top: 12px;

    color: #6eaaff;

    font-size: 15px;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.profile-description {

    max-width: 550px;

    margin-top: 25px;

    color: var(--muted);

    font-size: 15px;
}


/* =================================
   STATS
================================= */

.profile-stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    border-top:
        1px solid var(--border);

    border-bottom:
        1px solid var(--border);
}

.profile-stat {

    padding:
        25px;

    text-align: center;

    border-right:
        1px solid var(--border);
}

.profile-stat:last-child {

    border-right: none;
}

.profile-stat .stat-icon {

    display: block;

    font-size: 20px;

    margin-bottom: 5px;
}

.profile-stat strong {

    display: block;

    color: white;

    font-size: 32px;

    line-height: 1;
}

.profile-stat small {

    display: block;

    margin-top: 6px;

    color: var(--muted);

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;
}


/* =================================
   ONDERSTE SECTIES
================================= */

.profile-sections {

    padding: 40px 50px 50px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}

.profile-section,
.death-info,
.events-empty {

    padding: 25px;

    border:
        1px solid var(--border);

    border-radius:
        16px;

    background:
        rgba(255, 255, 255, 0.025);
}

.profile-section h2 {

    color: white;

    font-size: 20px;

    margin-bottom: 10px;
}

.profile-section p {

    color: var(--muted);

    font-size: 14px;
}


/* =================================
   DEATH INFO
================================= */

.death-info {

    border-color:
        rgba(255, 48, 63, 0.2);

    background:
        rgba(255, 48, 63, 0.04);
}

.death-title {

    margin-bottom: 12px;

    color: #ff6671;

    font-weight: 900;
}

.death-info p {

    margin-top: 5px;

    color: var(--muted);

    font-size: 13px;
}

.death-info strong {

    color: #dbe3f1;
}


/* =================================
   EVENTS
================================= */

.events-empty {

    display: flex;

    align-items: center;

    gap: 15px;

    color: var(--muted);
}

.events-empty span {

    font-size: 24px;
}

.events-empty p {

    margin: 0;
}


/* =================================
   FOUT / LADEN
================================= */

.profile-loading,
.profile-error {

    padding: 80px 25px;

    text-align: center;
}

.profile-error h1 {

    color: white;

    font-size: 35px;

    margin-bottom: 10px;
}

.profile-error p {

    color: var(--muted);

    margin-bottom: 25px;
}

.error-icon {

    width: 70px;
    height: 70px;

    margin:
        0 auto 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--red),
            var(--blue)
        );

    color: white;

    font-size: 30px;

    font-weight: 900;
}


/* =================================
   RESPONSIVE
================================= */

@media (max-width: 850px) {

    .profile-top {

        grid-template-columns: 1fr;

        text-align: center;

        gap: 10px;

        padding:
            40px 25px;
    }

    .profile-skin-area {

        min-height: 280px;
    }

    .profile-skin {

        width: 260px;
        height: 260px;
    }

    .profile-description {

        margin-left: auto;
        margin-right: auto;
    }

    .profile-status {

        margin-top: 10px;
    }

    .profile-sections {

        padding:
            25px;

        grid-template-columns: 1fr;
    }
}


@media (max-width: 600px) {

    .player-profile {

        width:
            min(100% - 22px, 1050px);

        padding-top: 45px;
    }

    .profile-card {

        border-radius: 18px;
    }

    .profile-top {

        padding:
            30px 18px;
    }

    .profile-skin-area {

        min-height: 240px;
    }

    .profile-skin {

        width: 220px;
        height: 220px;
    }

    .profile-main h1 {

        font-size: 48px;

        letter-spacing: -2px;
    }

    .profile-stats {

        grid-template-columns: 1fr;
    }

    .profile-stat {

        border-right: none;

        border-bottom:
            1px solid var(--border);
    }

    .profile-stat:last-child {

        border-bottom: none;
    }

    .profile-sections {

        padding:
            18px;
    }
}

</style>

</body>
</html>
