<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Statistieken | GJ Creator SMP</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="brand">
            GJ CREATOR SMP
        </a>


        <button
            class="menu-button"
            id="menuButton">
            ☰
        </button>


        <nav
            class="navigation"
            id="navigation">

            <a href="index.html">
                Home
            </a>

            <a href="spelers.html">
                Deelnemers
            </a>

            <a
                href="statistieken.html"
                class="active">

                Statistieken

            </a>

            <a href="tierlist.html">
                Tierlist
            </a>

            <a href="bingo.html">
                Bingo
            </a>

        </nav>

    </div>

</header>



<main class="page-container">


    <div class="hero-label">
        SEIZOEN 1 • HARDCORE
    </div>


    <h1 class="page-title">
        STATISTIEKEN
    </h1>


    <p class="page-description">
        De actuele statistieken van GJ Creator SMP.
    </p>



    <div class="stats-grid">


        <div class="stat-card">

            <span>
                DEELNEMERS
            </span>

            <strong id="totalPlayers">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                LEVEND
            </span>

            <strong id="alivePlayers">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                DOOD
            </span>

            <strong id="deadPlayers">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                TOTAAL KILLS
            </span>

            <strong id="totalKills">
                0
            </strong>

        </div>


    </div>



    <section class="stats-section">

        <h2>
            Kill Leaderboard
        </h2>


        <div
            id="killLeaderboard"
            class="leaderboard">
        </div>

    </section>



    <section class="stats-section">

        <h2>
            Alle deelnemers
        </h2>


        <div
            id="playerStats"
            class="player-stats-list">
        </div>

    </section>


</main>



<footer class="site-footer">

    <div class="footer-inner">

        <div>

            <div class="footer-brand">
                GJ CREATOR SMP
            </div>

            <p>
                Seizoen 1 • Hardcore • Community
            </p>

        </div>

        <p>
            © 2026 GJ Creator SMP
        </p>

    </div>

</footer>



<script src="spelers.js"></script>


<script>


const menuButton =
    document.getElementById("menuButton");

const navigation =
    document.getElementById("navigation");


menuButton.onclick = () => {

    navigation.classList.toggle("open");

    menuButton.textContent =
        navigation.classList.contains("open")
            ? "✕"
            : "☰";

};



const total =
    spelers.length;


const alive =
    spelers.filter(
        speler =>
            speler.status === "levend"
    ).length;


const dead =
    spelers.filter(
        speler =>
            speler.status === "dood"
    ).length;


const kills =
    spelers.reduce(
        (sum, speler) =>
            sum + (speler.kills || 0),
        0
    );



document.getElementById(
    "totalPlayers"
).textContent = total;


document.getElementById(
    "alivePlayers"
).textContent = alive;


document.getElementById(
    "deadPlayers"
).textContent = dead;


document.getElementById(
    "totalKills"
).textContent = kills;



const leaderboard =
    document.getElementById(
        "killLeaderboard"
    );



const sorted =
    [...spelers].sort(
        (a, b) =>
            (b.kills || 0) -
            (a.kills || 0)
    );



sorted.forEach(
    (speler, index) => {

        const item =
            document.createElement("a");

        item.href =
            "speler.html?id=" +
            encodeURIComponent(speler.id);

        item.className =
            "leaderboard-item";


        item.innerHTML = `

            <span class="rank">
                #${index + 1}
            </span>

            <img
                src="${speler.skin}"
                alt="${speler.naam}">

            <strong>
                ${speler.naam}
            </strong>

            <span>
                ${speler.kills || 0} kills
            </span>

        `;


        leaderboard.appendChild(item);

    }
);



const playerStats =
    document.getElementById(
        "playerStats"
    );



spelers.forEach(
    speler => {

        const item =
            document.createElement("a");

        item.href =
            "speler.html?id=" +
            encodeURIComponent(speler.id);

        item.className =
            "player-stat-row";


        const alive =
            speler.status === "levend";


        item.innerHTML = `

            <div>

                <strong>
                    ${speler.naam}
                </strong>

                <span class="${
                    alive
                        ? "alive-text"
                        : "dead-text"
                }">

                    ${alive
                        ? "● LEVEND"
                        : "● DOOD"}

                </span>

            </div>


            <div>

                <strong>
                    ${speler.kills || 0}
                </strong>

                <span>
                    Kills
                </span>

            </div>


            <div>

                <strong>
                    ${speler.events || 0}
                </strong>

                <span>
                    Events
                </span>

            </div>

        `;


        playerStats.appendChild(item);

    }
);


</script>


<style>


.stats-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-top: 40px;

}


.stat-card {

    padding: 25px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    background:
        var(--card);

}


.stat-card span {

    color:
        var(--muted);

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1px;

}


.stat-card strong {

    display: block;

    margin-top: 8px;

    font-size: 35px;

}


.stats-section {

    margin-top: 45px;

}


.stats-section h2 {

    margin-bottom: 18px;

}


.leaderboard,
.player-stats-list {

    display: grid;

    gap: 10px;

}


.leaderboard-item,
.player-stat-row {

    display: flex;

    align-items: center;

    gap: 15px;

    padding: 15px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background:
        var(--card);

    color: white;

    text-decoration: none;

}


.leaderboard-item:hover,
.player-stat-row:hover {

    background:
        var(--card-hover);

}


.leaderboard-item img {

    width: 45px;

    height: 45px;

    image-rendering: pixelated;

}


.rank {

    width: 35px;

    color:
        var(--muted);

    font-weight: 900;

}


.leaderboard-item span:last-child {

    margin-left: auto;

    color:
        var(--blue-light);

    font-weight: 900;

}


.player-stat-row {

    justify-content: space-between;

}


.player-stat-row > div {

    min-width: 100px;

}


.player-stat-row span {

    display: block;

    margin-top: 3px;

    color:
        var(--muted);

    font-size: 10px;

}


.alive-text {

    color: #45e995 !important;

}


.dead-text {

    color: #ff5362 !important;

}


@media(max-width:700px) {

    .stats-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .player-stat-row {

        gap: 8px;

    }


    .player-stat-row > div {

        min-width: 0;

    }

}


@media(max-width:450px) {

    .stats-grid {

        grid-template-columns: 1fr 1fr;

    }


    .player-stat-row {

        font-size: 12px;

    }

}

</style>


</body>

</html>
