<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deelnemers | GJ Creator SMP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <div class="header-inner">

        <a href="index.html" class="brand">
            GJ CREATOR SMP
        </a>

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Menu">
            ☰
        </button>

        <nav class="navigation" id="navigation">
            <a href="index.html">Home</a>
            <a href="spelers.html" class="active">Deelnemers</a>
            <a href="statistieken.html">Statistieken</a>
            <a href="tierlist.html">Tierlist</a>
            <a href="bingo.html">Bingo</a>
        </nav>

    </div>
</header>


<main class="page-container">

    <div class="hero-label">
        SEIZOEN 1 • HARDCORE
    </div>

    <h1 class="page-title">
        DEELNEMERS
    </h1>

    <p class="page-description">
        Bekijk alle deelnemers van de GJ Creator SMP.
        In Hardcore betekent doodgaan het einde.
    </p>


    <div class="players-grid" id="playersGrid">
        <p class="loading">
            Deelnemers laden...
        </p>
    </div>

</main>


<footer class="site-footer">

    <div class="footer-inner">

        <div>
            <div class="footer-brand">
                GJ CREATOR SMP
            </div>

            <p>
                Seizoen 1 • Hardcore • Community
            </p>
        </div>

        <p>
            © 2026 GJ Creator SMP
        </p>

    </div>

</footer>


<script src="spelers.js"></script>

<script>

    /* =========================
       MOBIEL MENU
    ========================= */

    const menuButton =
        document.getElementById("menuButton");

    const navigation =
        document.getElementById("navigation");


    menuButton.addEventListener("click", () => {

        navigation.classList.toggle("open");

        const open =
            navigation.classList.contains("open");

        menuButton.textContent =
            open ? "✕" : "☰";

    });


    /* =========================
       DEELNEMERS
    ========================= */

    const playersGrid =
        document.getElementById("playersGrid");


    function laadSpelers() {

        if (
            typeof spelers === "undefined"
        ) {

            playersGrid.innerHTML = `
                <div class="error-box">
                    <h2>Spelers konden niet worden geladen</h2>
                    <p>
                        Controleer of <strong>spelers.js</strong>
                        in dezelfde map staat als spelers.html.
                    </p>
                </div>
            `;

            return;
        }


        if (
            !Array.isArray(spelers) ||
            spelers.length === 0
        ) {

            playersGrid.innerHTML = `
                <div class="error-box">
                    <h2>Geen deelnemers</h2>
                    <p>
                        Voeg spelers toe in spelers.js.
                    </p>
                </div>
            `;

            return;
        }


        playersGrid.innerHTML = "";


        spelers.forEach(speler => {

            const card =
                document.createElement("a");

            card.className =
                "player-card";

            card.href =
                "speler.html?id=" +
                encodeURIComponent(speler.id);


            const dood =
                speler.status === "dood";


            card.innerHTML = `

                <div class="player-skin">

                    <img
                        src="${speler.skin}"
                        alt="Minecraft skin van ${speler.naam}"
                        onerror="
                            this.src='https://mc-heads.net/avatar/Steve/300';
                        "
                    >

                </div>


                <div class="player-info">

                    <div class="player-status ${
                        dood ? "dead" : "alive"
                    }">

                        <span></span>

                        ${
                            dood
                                ? "DOOD"
                                : "LEVEND"
                        }

                    </div>


                    <h2>
                        ${speler.naam}
                    </h2>


                    <p class="player-role">
                        ${speler.rol || "Deelnemer"}
                    </p>


                    <div class="player-stats">

                        <div>
                            <strong>
                                ${speler.kills || 0}
                            </strong>

                            <span>
                                Kills
                            </span>
                        </div>


                        <div>
                            <strong>
                                ${speler.events || 0}
                            </strong>

                            <span>
                                Events
                            </span>
                        </div>

                    </div>

                </div>

            `;


            playersGrid.appendChild(card);

        });

    }


    laadSpelers();

</script>


<style>

    .players-grid {

        display: grid;

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 20px;

        margin-top: 40px;

    }


    .player-card {

        position: relative;

        display: flex;

        flex-direction: column;

        overflow: hidden;

        min-height: 360px;

        border:
            1px solid var(--border);

        border-radius:
            var(--radius);

        background:
            var(--card);

        color: var(--text);

        text-decoration: none;

        box-shadow:
            var(--shadow);

        transition:
            transform .2s ease,
            border-color .2s ease,
            background .2s ease;

    }


    .player-card:hover {

        transform:
            translateY(-6px);

        border-color:
            rgba(36,124,255,.5);

        background:
            var(--card-hover);

    }


    .player-skin {

        height: 210px;

        display: flex;

        align-items: flex-end;

        justify-content: center;

        overflow: hidden;

        background:
            linear-gradient(
                145deg,
                rgba(255,48,63,.18),
                rgba(36,124,255,.18)
            );

    }


    .player-skin img {

        width: 190px;

        height: 190px;

        object-fit: contain;

        image-rendering: pixelated;

        transform:
            translateY(10px);

    }


    .player-info {

        padding: 20px;

    }


    .player-status {

        display: flex;

        align-items: center;

        gap: 7px;

        margin-bottom: 7px;

        font-size: 10px;

        font-weight: 900;

        letter-spacing: 1px;

    }


    .player-status span {

        width: 7px;

        height: 7px;

        border-radius: 50%;

        background: #35e58a;

        box-shadow:
            0 0 10px #35e58a;

    }


    .player-status.dead {

        color: #ff5b68;

    }


    .player-status.dead span {

        background: #ff3040;

        box-shadow:
            0 0 10px #ff3040;

    }


    .player-status.alive {

        color: #54e89b;

    }


    .player-info h2 {

        margin: 0;

        font-size: 25px;

    }


    .player-role {

        margin-top: 5px;

        color:
            var(--muted);

    }


    .player-stats {

        display: grid;

        grid-template-columns:
            1fr 1fr;

        gap: 8px;

        margin-top: 18px;

    }


    .player-stats div {

        padding: 10px;

        border-radius: 10px;

        background:
            rgba(255,255,255,.035);

        text-align: center;

    }


    .player-stats strong {

        display: block;

        color: white;

        font-size: 20px;

    }


    .player-stats span {

        color:
            var(--muted);

        font-size: 9px;

        font-weight: 800;

        text-transform: uppercase;

    }


    .loading {

        grid-column: 1 / -1;

        padding: 40px;

        text-align: center;

        color:
            var(--muted);

    }


    .error-box {

        grid-column: 1 / -1;

        padding: 30px;

        border:
            1px solid rgba(255,48,63,.3);

        border-radius:
            var(--radius);

        background:
            rgba(255,48,63,.06);

        text-align: center;

    }


    .error-box h2 {

        margin-bottom: 10px;

    }


    .error-box p {

        color:
            var(--muted);

    }


    @media (max-width: 850px) {

        .players-grid {

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

        }

    }


    @media (max-width: 550px) {

        .players-grid {

            grid-template-columns: 1fr;

        }


        .player-card {

            min-height: 330px;

        }


        .player-skin {

            height: 190px;

        }

    }

</style>

</body>
</html>
