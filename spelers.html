<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Deelnemers | GJ Creator SMP</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="brand">
            GJ CREATOR SMP
        </a>


        <button
            class="menu-button"
            id="menuButton">
            ☰
        </button>


        <nav
            class="navigation"
            id="navigation">

            <a href="index.html">
                Home
            </a>

            <a
                href="spelers.html"
                class="active">

                Deelnemers

            </a>

            <a href="statistieken.html">
                Statistieken
            </a>

            <a href="tierlist.html">
                Tierlist
            </a>

            <a href="bingo.html">
                Bingo
            </a>

        </nav>

    </div>

</header>



<main class="page-container">


    <div class="hero-label">
        SEIZOEN 1 • HARDCORE
    </div>


    <h1 class="page-title">
        DEELNEMERS
    </h1>


    <p class="page-description">
        Bekijk alle deelnemers van GJ Creator SMP.
    </p>



    <div
        class="players-grid"
        id="playersGrid">

    </div>


</main>



<footer class="site-footer">

    <div class="footer-inner">

        <div>

            <div class="footer-brand">
                GJ CREATOR SMP
            </div>

            <p>
                Seizoen 1 • Hardcore • Community
            </p>

        </div>


        <p>
            © 2026 GJ Creator SMP
        </p>

    </div>

</footer>



<script src="spelers.js"></script>


<script>


/* =================================
   MOBIEL MENU
================================= */

const menuButton =
    document.getElementById("menuButton");

const navigation =
    document.getElementById("navigation");


menuButton.addEventListener(
    "click",
    () => {

        navigation.classList.toggle("open");

        menuButton.textContent =
            navigation.classList.contains("open")
                ? "✕"
                : "☰";

    }
);



/* =================================
   CONTROLEER ZICHTBAARHEID
================================= */

function spelerIsZichtbaar(speler) {


    /*
     * Als zichtbaar false is,
     * blijft de speler verborgen.
     */

    if (speler.zichtbaar === false) {
        return false;
    }


    /*
     * Als er geen tijd is ingesteld,
     * is de speler direct zichtbaar.
     */

    if (!speler.zichtbaarVanaf) {
        return true;
    }


    /*
     * De ingestelde datum/tijd
     * wordt vergeleken met de huidige tijd.
     */

    const huidigeTijd =
        new Date();


    const zichtbaarheidTijd =
        new Date(
            speler.zichtbaarVanaf
        );


    return huidigeTijd >=
        zichtbaarheidTijd;

}



/* =================================
   DEELNEMERS LADEN
================================= */

const playersGrid =
    document.getElementById(
        "playersGrid"
    );



function laadSpelers() {


    playersGrid.innerHTML = "";


    const zichtbareSpelers =
        spelers.filter(
            speler =>
                spelerIsZichtbaar(speler)
        );


    /*
     * Geen spelers zichtbaar
     */

    if (zichtbareSpelers.length === 0) {

        playersGrid.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    🔒
                </div>

                <h2>
                    Deelnemers worden binnenkort onthuld
                </h2>

                <p>
                    De deelnemers worden automatisch
                    zichtbaar zodra de ingestelde tijd
                    is bereikt.
                </p>

            </div>

        `;

        return;

    }



    /*
     * Spelers tonen
     */

    zichtbareSpelers.forEach(
        speler => {


            const card =
                document.createElement("a");


            card.className =
                "player-card";


            card.href =
                "speler.html?id=" +
                encodeURIComponent(
                    speler.id
                );


            const isAlive =
                speler.status ===
                "levend";


            card.innerHTML = `

                <div class="player-skin">

                    <img
                        src="${speler.skin}"
                        alt="${speler.naam}">

                </div>


                <div class="player-info">


                    <div class="player-status ${
                        isAlive
                            ? "alive"
                            : "dead"
                    }">

                        <span></span>

                        ${
                            isAlive
                                ? "LEVEND"
                                : "DOOD"
                        }

                    </div>


                    <h2>
                        ${speler.naam}
                    </h2>


                    <p class="player-role">
                        ${speler.rol}
                    </p>


                    <div class="player-stats">

                        <div>

                            <strong>
                                ${speler.kills || 0}
                            </strong>

                            <span>
                                Kills
                            </span>

                        </div>


                        <div>

                            <strong>
                                ${speler.events || 0}
                            </strong>

                            <span>
                                Events
                            </span>

                        </div>

                    </div>


                </div>

            `;


            playersGrid.appendChild(
                card
            );

        }
    );

}



/* =================================
   AUTOMATISCH CONTROLEREN
================================= */

laadSpelers();


/*
 * Controleer iedere seconde opnieuw.
 *
 * Daardoor hoef je de pagina niet
 * opnieuw te laden wanneer de klok
 * precies 22:05 bereikt.
 */

setInterval(
    laadSpelers,
    1000
);


</script>



<style>


.players-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

    margin-top: 40px;

}



.player-card {

    display: block;

    overflow: hidden;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    background:
        var(--card);

    color: var(--text);

    text-decoration: none;

    transition:
        .2s ease;

}



.player-card:hover {

    transform:
        translateY(-5px);

    background:
        var(--card-hover);

}



.player-skin {

    height: 220px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(255,48,63,.18),
            rgba(36,124,255,.18)
        );

}



.player-skin img {

    width: 190px;

    height: 190px;

    object-fit: contain;

    image-rendering: pixelated;

}



.player-info {

    padding: 20px;

}



.player-status {

    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 1px;

}



.player-status span {

    width: 8px;

    height: 8px;

    border-radius: 50%;

}



.player-status.alive {

    color:
        #42e995;

}



.player-status.alive span {

    background:
        #42e995;

    box-shadow:
        0 0 10px #42e995;

}



.player-status.dead {

    color:
        #ff4d5c;

}



.player-status.dead span {

    background:
        #ff3040;

    box-shadow:
        0 0 10px #ff3040;

}



.player-info h2 {

    margin:
        8px 0 4px;

}



.player-role {

    margin: 0;

    color:
        var(--muted);

}



.player-stats {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 18px;

}



.player-stats div {

    padding: 10px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.04);

    text-align: center;

}



.player-stats strong {

    display: block;

    font-size: 20px;

}



.player-stats span {

    color:
        var(--muted);

    font-size: 9px;

    text-transform: uppercase;

}



.empty-box {

    grid-column:
        1 / -1;

    padding: 60px 20px;

    border:
        1px solid var(--border);

    border-radius:
        var(--radius);

    background:
        var(--card);

    text-align: center;

}



.empty-icon {

    font-size: 45px;

    margin-bottom: 15px;

}



.empty-box h2 {

    margin-bottom: 10px;

}



.empty-box p {

    max-width: 500px;

    margin: auto;

    color:
        var(--muted);

    line-height: 1.6;

}



@media(max-width: 800px) {

    .players-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}



@media(max-width: 550px) {

    .players-grid {

        grid-template-columns:
            1fr;

    }

}

</style>
